services:
  # ── Backend API (Node/Express) ──────────────────────────────────────
  - type: web
    name: nexura-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        sync: false # set to your deployed frontend URL, e.g. https://nexura-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nexura-db
          property: connectionString
      - key: DEV_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # ── Frontend (Next.js) ───────────────────────────────────────────────
  - type: web
    name: nexura-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: NEXT_PUBLIC_API_URL
        sync: false # e.g. https://nexura-backend.onrender.com/api
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false

databases:
  - name: nexura-db
    plan: free
    databaseName: nexura
    user: nexura
